<!-- Functional Animation CSS (Zero Decorative Styles) -->
<style>
  /* Fixed overlay base state - strictly 100svh, zero scrollbar */
  .contact-page {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    width: 100svw !important;
    height: 100vh !important;
    height: 100svh !important;
    max-height: 100svh !important;
    z-index: 9999999 !important;
    display: none;
    visibility: hidden;
    pointer-events: none;
    overflow: hidden !important;
    overflow-y: hidden !important;
    overflow-x: hidden !important;
    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }

  .contact-page::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  .contact-page.is-active {
    display: flex !important;
    visibility: visible !important;
    pointer-events: auto !important;
  }

  /* Transition SVG full coverage */
  .contact-transition,
  .svg-tcontact {
    pointer-events: none;
  }

  .contact-transition svg,
  .svg-tcontact svg {
    overflow: visible;
  }

  /* SplitText & mask utilities */
  .contact-heading-char {
    display: inline-block;
    will-change: transform, opacity, text-shadow;
    transform-origin: center center;
  }

  .contact-para-line-mask {
    overflow: hidden !important;
    display: block !important;
  }

  .contact-para-line {
    display: block !important;
    will-change: transform, opacity;
  }

  /* Email headings: strictly single line with overflow hidden */
  .email-heading,
  .contact-right .email-heading {
    white-space: nowrap !important;
    word-break: keep-all !important;
  }

  .contact-word-mask {
    overflow: hidden !important;
    display: inline-block !important;
    white-space: nowrap !important;
    vertical-align: top !important;
  }

  .contact-word {
    display: inline-block !important;
    white-space: nowrap !important;
    will-change: transform, opacity;
  }

  /* Email links: NO overflow hidden */
  .email-link,
  .contact-right .email-link,
  .contact-right [class*="email-link"] {
    white-space: nowrap !important;
    word-break: keep-all !important;
    overflow: visible !important;
    display: inline-block !important;
  }

  .contact-email-char {
    display: inline-block;
    transform-origin: center center;
    will-change: transform, text-shadow;
  }

  .contact-social {
    will-change: transform, opacity;
  }

  .contact-img-wrap {
    overflow: visible !important;
    contain: none !important;
    display: flex !important;
    align-items: flex-end !important;
    justify-content: center !important;
    pointer-events: none !important;
  }

  .contact-img-wrap svg,
  .contact-img-wrap img,
  .contact-img {
    overflow: visible !important;
    max-height: 52vh !important;
    max-height: 52svh !important;
    width: auto !important;
    max-width: 85vw !important;
    object-fit: contain !important;
    display: block !important;
    transform-origin: bottom center !important;
    -webkit-transform-origin: bottom center !important;
    will-change: transform, opacity;
  }

  @media (max-width: 767px) {
    .contact-img-wrap svg,
    .contact-img-wrap img,
    .contact-img {
      max-height: 35svh !important;
      width: auto !important;
      object-fit: contain !important;
    }
  }
</style>
