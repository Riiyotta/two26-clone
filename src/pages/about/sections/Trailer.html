<!-- LENIS SMOOTH SCROLL (SMART BODY / .page SWITCHER)        -->
<!-- Paste in Page / Site Settings (Before </body>)           -->
<!-- ======================================================= -->
<style id="lenis-page-styles">
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
  }

  .page {
    width: 100%;
    height: 100%;
    height: 100dvh;
    height: calc(var(--vh, 1vh) * 100);
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    -webkit-overflow-scrolling: touch;
    box-sizing: border-box;
  }
</style>
